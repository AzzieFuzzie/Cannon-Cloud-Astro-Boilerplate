paths:
  uploads: src/assets/images
  static: public

# Registers src/data/home.json as a CloudCannon data source under the key "home".
# This makes its fields resolvable via @data[home].<field> in data-prop attributes,
# and exposes the file in the CloudCannon sidebar under Data.
data_config:
  home:
    path: src/data/home.json

# Clean global configuration inputs to stop unwanted <p> tags without listing every file key
_inputs:
  # Keeps rich text block rules strictly for your hero slogan element (which uses <em> tags)
  slogan:
    type: text

  # Dynamic Catch-All Rule: Any frontmatter key ending with 'Heading' or 'Subheading' treats text as a plain string
  '*Heading':
    type: text

  # Dynamic Catch-All Rule: Any frontmatter key ending with 'Button' or 'Description' treats text as a plain string
  '*Button':
    type: text
  '*Description':
    type: text

  # Dynamic Catch-All Rule: Any frontmatter key ending with 'Image' will automatically use the asset file picker mapped to src/assets
  '*Image':
    type: image
    options:
      path: src/assets/uploads

  # Dynamic Catch-All Rule: covers keys ending in 'ImageSrc' (e.g. aboutImageSrc, eventsImageSrc)
  '*ImageSrc':
    type: image
    options:
      path: src/assets/uploads

collections_config:
  menu:
    path: src/content/menu
    output: false
    icon: restaurant_menu
    name: Menu Categories
    schemas:
      default:
        path: src/content/menu/starters.json
    _inputs:
      categoryName:
        type: text
        label: Category Name
      displayOrder:
        type: number
        label: Display Order
      items:
        type: array
        label: Menu Items
        options:
          structures:
            value:
              name: ''
              description: ''
              price: ''
              dietary: []
      name:
        type: text
      description:
        type: textarea
      price:
        type: text
      dietary:
        type: multiselect
        options:
          values:
            - Vegan
            - Vegetarian
            - Gluten-Free
            - Nut-Free
            - Halal
          allow_create: true

  pages:
    path: src/pages
    glob:
      - '*.astro'
    icon: wysiwyg
    url: /[slug]/
    disable_url: false
    include_developer_files: false
    _enabled_editors:
      - visual
    disable_add: true
    disable_add_folder: false
    disable_file_actions: false

timezone: Africa/Johannesburg

markdown:
  engine: commonmark
  options:
    xhtml: false
    breaks: false
    linkify: false
    typographer: false
    spaced_lists: false
    sentence_per_line: false
    gfm: true
    code_block_fences: '```'
    escape_snippets_in_code_blocks: false
    treat_indentation_as_code: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    attributes: false
