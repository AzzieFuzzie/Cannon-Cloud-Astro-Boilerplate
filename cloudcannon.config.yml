paths:
  uploads: src/assets/images
  static: public

# Registers each src/data/*.json file as a CloudCannon data source under its key.
# This makes its fields resolvable via @data[<key>].<field> in data-prop attributes,
# and exposes the file in the CloudCannon sidebar under Data.
data_config:
  home:
    path: src/data/home.json
  about:
    path: src/data/about.json
  book:
    path: src/data/book.json
  contact:
    path: src/data/contact.json
  # Shared contact details, trading hours and copyright (footer, Contact and Book pages)
  site:
    path: src/data/site.json

# Clean global configuration inputs to stop unwanted <p> tags without listing every file key
_inputs:
  # Keeps rich text block rules strictly for your hero slogan element (which uses <em> tags)
  slogan:
    type: text

  # Dynamic Catch-All Rule: Any frontmatter key ending with 'Heading' or 'Subheading' treats text as a plain string
  '*Heading':
    type: text

  # Dynamic Catch-All Rule: Any frontmatter key ending with 'Button' or 'Description' treats text as a plain string
  '*Button':
    type: text
  '*Description':
    type: text

  # Dynamic Catch-All Rule: Any frontmatter key ending with 'Image' will automatically use the asset file picker mapped to src/assets
  '*Image':
    type: image
    options:
      path: src/assets/images

  # Dynamic Catch-All Rule: covers keys ending in 'ImageSrc' (e.g. aboutImageSrc, eventsImageSrc)
  '*ImageSrc':
    type: image
    options:
      path: src/assets/images

  # Mux playback ID of the home page background video (src/data/home.json)
  heroVideoPlaybackId:
    type: text
    label: Hero Video (Mux playback ID)

  # FAQ entries on the home page (src/data/home.json)
  faqs:
    type: array
    label: FAQs
    options:
      structures:
        values:
          - value:
              question: ''
              answer: ''
  question:
    type: text
  answer:
    type: textarea

  # Guest reviews slider on the home page (src/data/home.json)
  reviews:
    type: array
    label: Reviews
    options:
      structures:
        values:
          - value:
              text: ''
              author: ''
  text:
    type: textarea
  author:
    type: text

  # Image lists on the home page (src/data/home.json): food carousel and image marquee
  foodGallery:
    type: array
    label: Food Carousel
    options:
      structures:
        values:
          - value:
              image: ''
              alt: ''
  marquee:
    type: array
    label: Image Marquee
    options:
      structures:
        values:
          - value:
              image: ''
              alt: ''
  image:
    type: image
    options:
      path: src/assets/images
  alt:
    type: text

  # Shared site details (src/data/site.json)
  phone:
    type: text
  whatsapp:
    type: text
  email:
    type: email
  addressLine1:
    type: text
  addressLine2:
    type: text
  mapsUrl:
    type: url
  copyright:
    type: text
  hours:
    type: array
    label: Trading Hours
    options:
      structures:
        values:
          - value:
              days: ''
              time: ''
  days:
    type: text
  time:
    type: text

collections_config:
  menu:
    path: src/content/menu
    output: false
    icon: restaurant_menu
    name: Menu Categories
    schemas:
      default:
        path: src/content/menu/starters.json
    _inputs:
      categoryName:
        type: text
        label: Category Name
      displayOrder:
        type: number
        label: Display Order
      # Used by the category and by every item in it (the item image is shown when the item is hovered or tapped)
      image:
        type: image
        label: Image
        options:
          path: src/assets/images
      imageAlt:
        type: text
        label: Image Alt Text
      items:
        type: array
        label: Menu Items
        options:
          structures:
            values:
              - label: Menu Item
                value:
                  name: ''
                  description: ''
                  price: ''
                  image: ''
                  imageAlt: ''
                  dietary: []
      name:
        type: text
      description:
        type: textarea
      price:
        type: text
      dietary:
        type: multiselect
        options:
          values:
            - Vegan
            - Vegetarian
            - Gluten-Free
            - Nut-Free
            - Halal
          allow_create: true

  pages:
    path: src/pages
    glob:
      - '*.astro'
    icon: wysiwyg
    url: /[slug]/
    disable_url: false
    include_developer_files: false
    _enabled_editors:
      - visual
    disable_add: true
    disable_add_folder: false
    disable_file_actions: false

timezone: Africa/Johannesburg

markdown:
  engine: commonmark
  options:
    xhtml: false
    breaks: false
    linkify: false
    typographer: false
    spaced_lists: false
    sentence_per_line: false
    gfm: true
    code_block_fences: '```'
    escape_snippets_in_code_blocks: false
    treat_indentation_as_code: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    attributes: false
