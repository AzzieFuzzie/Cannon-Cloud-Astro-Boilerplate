paths:
  uploads: public/uploads
  uploads_use_relative_path: false
  static: public
collections_config:
  pages:
    path: src/pages
    glob:
      - '*.astro'
    icon: wysiwyg
    url: /[slug]/
    disable_url: false
    include_developer_files: false
    preview:
      text:
      subtext:
      icon:
      icon_color:
      icon_background_color:
      image:
      metadata:
      gallery:
    _enabled_editors:
      - visual
    disable_add: true
    disable_add_folder: false
    disable_file_actions: false
timezone: Africa/Johannesburg
markdown:
  engine: commonmark
  options:
    xhtml: false
    breaks: false
    linkify: false
    typographer: false
    spaced_lists: false
    sentence_per_line: false
    gfm: true
    code_block_fences: '```'
    escape_snippets_in_code_blocks: false
    treat_indentation_as_code: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    attributes: false
